# Pinned so local builds match the CI `native` job (byte for byte on Linux
# and Windows; see build_all.sh for macOS). That job rebuilds native/dist/
# and fails when the libraries embedded in vcd_analyzer.py differ from it.
[toolchain]
channel = "1.96.0"
profile = "minimal"
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
]
