# Two guarantees per push/PR:
#   1. the released single file vcd_analyzer.py is byte-identical to src/
#      (edit src/, never the release file; `python _make.py` regenerates it)
#   2. the full test suite passes on the oldest (3.9) and newest supported
#      Python of each release-critical platform
# Windows is exercised when the planned fast variant (embedded native
# index-builder libraries) lands; the pure-Python file is platform-neutral.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: '3.9'  }
          - { os: ubuntu-latest,  python: '3.13' }
          - { os: macos-latest,   python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Release file matches src/
        run: python _make.py --check
      - name: Install pytest
        run: pip install pytest
      - name: Tests
        run: python -m pytest verify/ -q
