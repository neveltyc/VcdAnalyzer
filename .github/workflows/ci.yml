# Guarantees per push/PR:
#   1. both release files match src/ (lite byte-exactly; full by exact
#      src/-derived head/tail plus a structural check of the embedded
#      native part — the blobs need the Rust toolchain, so they are
#      checked structurally)
#   2. the full suite passes on the oldest (3.9) and newest supported
#      Python of each release-critical platform, Windows included: the
#      full variant's embedded native builder is exercised for real on
#      every matrix leg that has a matching library
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: '3.9'  }
          - { os: ubuntu-latest,  python: '3.13' }
          - { os: macos-latest,   python: '3.13' }
          - { os: windows-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Release files match src/
        run: python _make.py --check
      - name: Install pytest
        run: pip install pytest
      - name: Tests
        run: python -m pytest verify/ -q
