# Pinned so local builds match the CI `native` job (byte for byte, but for
# the per-build macOS LC_UUID; see build_all.sh). That job rebuilds
# native/dist/ and fails when the embedded libraries differ from it.
[toolchain]
channel = "1.96.0"
profile = "minimal"
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
]
